<!--
  L'enclume — la marque d'Établi, la MÊME partout : icône de l'app (.icns/.ico),
  barre latérale, écran de bienvenue, et ici le favicon de l'onglet.

  Minimaliste et à plat : un fond anthracite, l'enclume or (les kamas), l'éclat
  iris (l'XP). Aucun dégradé, aucune lueur. L'enclume dit l'artisanat d'un coup
  d'œil, là où un monogramme ne disait rien.

  Ici l'enclume est agrandie (moins de marge que l'icône d'app) : à la taille d'un
  onglet, il faut qu'elle remplisse, sinon elle tombe sous le pixel.

  POURQUOI CE FICHIER EST DANS public/ ET PAS DANS app/. Next sert une icône
  déclarée dans `app/` par une route, qui hérite du `force-dynamic` du layout —
  donc d'un `cache-control: no-store` que le cache de favicons refuse de retenir,
  et l'onglet retombe sur le globe. Depuis `public/`, c'est un statique mis en
  cache normalement, déclaré par `metadata.icons`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 1024 1024" role="img" aria-label="Établi">
  <rect width="1024" height="1024" rx="215" fill="#121212"/>
  <g transform="translate(512 540) scale(1.34) translate(-512 -540)">
    <g fill="#f0a01e">
      <path d="M 300 470 L 452 424 Q 470 419 492 419 L 726 419 Q 742 419 742 435 L 742 470 Q 742 486 726 486 L 636 486 Q 612 486 606 508 L 600 528 L 452 528 L 452 486 Q 452 470 300 470 Z"/>
      <path d="M 470 524 L 578 524 L 556 626 L 492 626 Z"/>
      <path d="M 388 620 Q 384 620 384 636 L 384 664 Q 384 700 420 700 L 628 700 Q 664 700 664 664 L 664 636 Q 664 620 648 620 Z"/>
    </g>
    <path fill="#9f8cf2" d="M 726 300 Q 736 340 776 350 Q 736 360 726 400 Q 716 360 676 350 Q 716 340 726 300 Z"/>
  </g>
</svg>
